# Dokploy attaches Traefik labels and the network when the domain is set on the
# service, so no ports are published here. The service name `web` stays: the
# Dokploy domain points at it.
services:
  web:
    build: .
    restart: unless-stopped
    # The host has no swap and also holds the owner's mail: a spike is killed,
    # not paged.
    mem_limit: 256m
    # Lets the non-root `node` user listen on port 80, so the Dokploy domain
    # port does not have to change.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    volumes:
      - deposim-data:/data
      # Daily backups land in /data/backups (same volume) unless BACKUP_DIR points elsewhere. To have the
      # server's Borg backup take them, bind a host path that Borg includes and set BACKUP_DIR; the host
      # path is not decided yet (notes/reference/deploy.md, "Backup"). The folder must be writable by uid 1000.
      #   - /var/backups/deposim:/backup
      # and under `environment:` BACKUP_DIR=/backup

volumes:
  deposim-data:
